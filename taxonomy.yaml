# Controlled vocabulary for masterlist entries. build.py rejects any value not listed here,
# so adding a new label = adding it here first (keeps tags consistent across hundreds of entries).

category:            # wet = new assay/protocol; dry = new computational method (dry list is "under construction")
  - wet
  - dry

domains:             # top-level grouping, in display order (Family graph bands, colours)
  - epigenome
  - transcriptome
  - proteome           # e.g. CITE-seq, ECCITE-seq, DOGMA-seq (antibody-derived tags)
  - genome
  - functional         # pooled screens and reporter libraries (GeCKO, MPRA, STARR-seq)

readouts:            # WHAT molecular quantity the assay measures -> its domain. Order within a domain = graph lane order.
  # If none of these describes the measurement, do not force the nearest one: flag it (MISSING_TAG) for the curator.
  3d-genome: epigenome                  # chromatin contacts / conformation (3C, Hi-C, SPRITE, GAM)
  chromatin-accessibility: epigenome    # open vs closed chromatin, nucleosome positioning (ATAC, DNase, MNase, NOMe GpC)
  histone-modification: epigenome       # histone marks (ChIP / CUT&Tag on histone marks)
  protein-dna-binding: epigenome        # TF / chromatin-protein occupancy on DNA (ChIP, CUT&RUN, DamID)
  dna-methylation: epigenome            # DNA base modifications. Parent tag: 5mC / 5hmC on DNA (bisulfite, enzymatic, TAPS); specific modifications below are tagged in ADDITION
  dna-6ma: epigenome                    # N6-methyladenine on DNA (sub-filter of dna-methylation)
  dna-5fc: epigenome                    # 5-formylcytosine on DNA (sub-filter of dna-methylation; CLEVER-seq)
  histone-turnover: epigenome           # nucleosome / histone exchange and turnover kinetics (CATCH-IT)
  chromatin-condensability: epigenome   # how readily native nucleosomes condense (Condense-seq); a biophysical property, not accessibility
  rna: transcriptome                    # steady-state transcript abundance, isoforms, splicing (RNA-seq, scRNA-seq)
  nascent-rna: transcriptome            # newly made vs pre-existing RNA (metabolic labelling, nascent / run-on)
  translation: transcriptome            # ribosome occupancy / translatome (Ribo-seq, ribosome footprinting)
  rna-structure: transcriptome          # RNA secondary/tertiary structure (SHAPE, DMS probing)
  rna-modification: transcriptome       # chemical marks / editing on RNA (m6A, pseudouridine, A-to-I)
  rna-protein-interaction: transcriptome  # where proteins bind RNA (CLIP family)
  rna-rna-interaction: transcriptome      # RNA-RNA contacts / duplexes between transcripts (KARR-seq)
  rna-chromatin-interaction: transcriptome  # RNAs contacting chromatin / DNA (GRID-seq, MARGI, ChAR-seq)
  immune-repertoire: transcriptome      # TCR / BCR receptor sequences
  protein: proteome                     # protein abundance via antibody-oligo tags or similar (CITE-seq ADTs)
  protein-localization: proteome        # which proteins sit near a bait or in a compartment (proximity labelling: TurboID, APEX); RNA localisation stays rna + subcellular
  glycan: proteome                      # cell-surface glycans (lectin-oligo tags)
  genome-sequence: genome               # genotype, CNV, SVs, assemblies, incl. RNA-virus genomes and strain typing
  microbial-composition: genome         # which microbes are present, e.g. per spatial sub-community (SAMPL-seq)
  lineage: genome                       # cell lineage / clonal history recorded in cells (barcodes, CRISPR recorders)
  replication-timing: genome            # when DNA replicates in S phase (copy number of S-phase vs G1 DNA)
  dna-damage: genome                    # DNA lesions, strand breaks and replication/repair error spectra
  raman-spectrum: functional            # label-free vibrational (Raman) cell biochemistry paired with sequencing (RamanOmics)
  functional-screen: functional         # abundance of each designed library member (guide, variant, reporter barcode)
                                        #   after selection/expression; NOT a per-cell transcriptome (Perturb-seq stays rna)

resolution:
  - bulk
  - single-cell
  - spatial
  - subcellular
  - single-molecule   # each read is one molecule held in place or tracked (SPIN-Seq)

temporal:            # OPTIONAL. How the method captures time; leave out for ordinary snapshot assays
  - metabolic-labeling       # new vs old RNA by nucleotide analogue (e.g. 4sU): scNT-seq, sci-fate, SLAM-seq
  - longitudinal-sampling    # repeatedly samples the SAME living cells: Live-seq, engineered RNA export
  - molecular-recording      # cells write a time-stamped record read out later: vault-based recorders

perturbation:        # OPTIONAL. The method perturbs cells/DNA and reads the effect out by sequencing (screens, reporters)
  - crispr-knockout
  - crispr-interference      # CRISPRi
  - crispr-activation        # CRISPRa
  - base-editing
  - prime-editing
  - saturation-editing       # every possible variant in a region, e.g. saturation genome editing
  - rna-targeting            # Cas13
  - reporter-assay           # MPRA, STARR-seq: barcoded reporter libraries
  - minigene-reporter        # splicing minigenes
  - transposon-insertion
  - chemical-perturbation    # drug / compound screens read out by sequencing

platform:            # OPTIONAL. Sequencing platform class, only when the method is built for / demonstrated on long reads
  - long-read           # umbrella: any long-read platform (always add this when pacbio or nanopore applies)
  - pacbio              # PacBio SMRT / HiFi
  - nanopore            # Oxford Nanopore (ONT)

scope:               # GENOMIC coverage only. Selecting a place in a tissue/nucleus is resolution (spatial/subcellular)
  - genome-wide         # e.g. ECHOS = genome-wide histone profile of an optically selected region
  - targeted            # restricted to chosen loci: capture oligos, viewpoints, amplicons

chemistry:           # key molecular steps; an assay usually has several
  - proximity-ligation
  - restriction-digest
  - mnase
  - tn5
  - antibody-pull-down      # ChIP-style IP
  - antibody-tethered-enzyme  # CUT&Tag / CUT&RUN style
  - oligo-capture
  - in-situ-hybridization   # labelled probes hybridise to RNA/DNA in fixed tissue and are decoded by imaging (FISH, MERFISH, ATLAS)
  - chemical-cleavage      # non-enzymatic cleavage of chromatin/DNA by a small molecule (MPE-Fe(II) in MPE-seq); added 2026-11-12
  - bisulfite-or-enzymatic-conversion
  - nucleotide-labeling     # EdU, 4sU, ...
  - bioorthogonal-conjugation  # acylation / click chemistry attaches barcodes directly onto RNA or DNA (BOB-seq)
  - split-pool-barcoding
  - combinatorial-indexing
  - droplet-microfluidics
  - plate-based
  - cryosectioning
  - imaging-guided-selection
  - long-read-sequencing
  - facs-sorting
  - reverse-transcription   # any RNA readout
  - dnase-digestion
  - radiation-cleavage      # ionizing radiation cuts DNA; correlated break ends report structure (RICC-seq)
  - adapter-ligation        # ligation of sequencing adapters is the step that defines the method (library-prep methods, PRIDE-NGS)
  - lesion-excision         # an enzyme (e.g. glycosylase) cuts at a damaged or modified base to expose it (GCLA-seq)
  - organic-extraction      # e.g. FAIRE phenol-chloroform partitioning
  - microfluidic-chip       # e.g. Fluidigm C1 chambers (not droplets)
  - amplicon-pcr            # targeted PCR amplicons as the library (panels, barcode genes)
  - sample-preservation     # chemistry that stabilises samples before library prep (e.g. biosilicification)
  - hydrogel-compartmentalization  # cells isolated by a hydrogel instead of droplets/wells (virtual microfluidics)
  - particle-templated-emulsion  # vortexing makes monodisperse emulsions around hydrogel particles; no microfluidic device (PIP-seq; PTE step of magniFIND-seq)
  - microwell-array         # cells settle into an array of picolitre wells with barcoded beads (Seq-Well, Microwell-seq)
  - spatial-barcode-array   # position-barcoded capture surface / beads; resolution comes from the array (Stereo-seq, Slide-seq)

# ---- Applicability tags (added 2026-11-10; ALL OPTIONAL, omit when the paper does not say - never guess) ----
throughput:          # cells/nuclei (or equivalent units) profiled in ONE experiment as demonstrated in the paper; single value
  - lt-1e3
  - 1e3-1e4
  - 1e4-1e5
  - 1e5-1e6
  - gt-1e6
input_sample:        # what material the method was run on / is designed for
  - live-cells
  - fixed-cells
  - nuclei
  - fresh-tissue
  - ffpe-archival      # FFPE blocks, archival or degraded samples (FFPE-dBIT, PERFF-seq)
  - low-input          # few cells / picogram input / single molecules
validated_system:    # first and main systems the method was shown to work in (can list several)
  - cell-line
  - primary-cells
  - tissue-in-vivo
  - organoid
species:             # species the method was demonstrated in
  - human
  - mouse
  - other-vertebrate
  - invertebrate
  - plant
  - microbe
# ---- Computational tools only (added 2026-11-12; beta). What the tool DOES with the data. Up to 2 per tool, in masterlist/dry_tasks.yaml ----
task:
  - preprocessing-qc          # cell calling, doublets, ambient RNA, normalisation, quality control, read processing
  - integration               # batch correction, atlas / dataset integration, reference mapping
  - multimodal-integration    # joins several modalities (RNA+ATAC+protein, spatial+scRNA) into one representation
  - clustering-annotation     # clustering, cell-type / state annotation, label transfer
  - trajectory-velocity       # pseudotime, RNA velocity, fate and dynamics
  - regulatory-networks       # gene regulatory networks, TF activity, enhancer-gene links, motif analysis
  - cell-communication        # ligand-receptor, cell-cell interaction, niches
  - spatial-analysis          # spatial domains, deconvolution, spatial mapping, subcellular localisation
  - perturbation-modelling    # predicting or analysing perturbation / drug / CRISPR responses
  - variants-clones           # SNV / CNV calling, clonality, lineage tracing, genotyping from sequencing
  - differential-analysis     # differential expression / accessibility / abundance, QTL, association testing
  - foundation-model          # large pretrained models of cells or genomes
  - dimensionality-visualization  # embeddings, representation learning, visualisation
  - benchmark-infrastructure  # benchmarks, frameworks, data structures, databases, atlases, pipelines
  - 3d-genome-analysis        # Hi-C and contact-map tools: structure prediction, domains, loops, contact-map enhancement
  - modification-calling      # calling base modifications (m6A, 5mC...) or RNA structure from nanopore, bisulfite or chemical-probing data
  - metagenomics-taxonomy     # species / taxonomic / virus / microbial profiling from sequencing reads
  - genome-assembly           # assembly, scaffolding, centromere / repeat annotation of genomes
  - sequence-to-function      # models predicting molecular function or signal from DNA / RNA sequence
  - disease-classification    # classifying disease or tumour type, or detecting cancer, from sequencing signal (cfDNA, methylation)
  - transcript-quantification # RNA-seq read-to-transcript work: transcript assembly, isoform/gene quantification, alternative splicing / polyadenylation, translation (ribosome profiling) analysis
  - population-genetics       # ancestry, identity-by-descent, phasing, imputation, selection, phylogenetics and molecular evolution from sequence data
  - read-alignment            # aligners and mapping of reads or whole genomes
  - genome-visualization      # genome browsers and visual inspection of alignments, variants or phylogeographic results
  - peak-calling-signal       # ChIP-seq / ATAC-seq peak calling, nucleosome-free regions and other signal-track processing
# targets: FREE TEXT list (not validated), epigenome/protein-binding methods only, e.g. [H3K27me3, CTCF, Pol II S2P]
