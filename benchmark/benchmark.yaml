# Hold-out set for scoring triage (and later the language-model classifier). Add every tricky paper you meet.
#   expect.triage      : should the free triage step pass it on? (true for anything the classifier must see)
#   expect.new_method  : does the paper introduce a new sequencing-based method?
#   expect.category    : wet | dry (only when new_method is true)
#   expect.methods     : names the pipeline must extract (case-insensitive match)
#   where_named        : title | abstract | fulltext - why this case is hard

- doi: 10.64898/2026.06.02.729594
  note: "SeqTag - title gives no hint; method named only in the abstract"
  where_named: abstract
  expect: {triage: true, new_method: true, category: wet, methods: [SeqTag]}

