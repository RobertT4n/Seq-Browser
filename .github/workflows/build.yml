name: Build masterlist

# Any push that touches the masterlist regenerates METHODS.md + docs/ (the website reads docs/ directly,
# via GitHub Pages "deploy from branch: main /docs" once the repo is public).
on:
  push:
    branches: [main]
    paths: ["masterlist/**", "taxonomy.yaml", "pipeline/build.py"]
  schedule:
    - cron: "0 6 * * 1"   # Mondays: refresh citation counts
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install --no-deps -r requirements.txt
      - name: Refresh citation counts (weekly run only)
        if: github.event_name != 'push'
        run: python pipeline/update_published.py && python pipeline/resolve_refs.py && python pipeline/update_citations.py
      - run: python pipeline/build.py   # fails the run (and publishes nothing) if any entry is invalid
      - name: Commit generated files
        run: |
          git config user.name "seqbrowser-bot"
          git config user.email "seqbrowser-bot@users.noreply.github.com"
          git add METHODS.md docs/ masterlist/citations.json
          git diff --cached --quiet || (git commit -m "Rebuild masterlist outputs" && git pull --rebase && git push)
