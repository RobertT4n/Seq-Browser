<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seq-Browser Family Tree</title>
<meta name="description" content="How sequencing methods descend from and build on one another, laid out over time.">
<link rel="stylesheet" href="style.css">
<style>
  body { overflow:hidden; }
  header { max-width:none; padding:14px 24px 12px; }
  header img { height:44px; } header h1 { font-size:22px; }
  /* full-bleed dark canvas under the normal site header */
  #stage { position:fixed; left:0; right:0; bottom:0; top:var(--top, 84px);
           --sbg:#0b0e1a; --sink:#e6e8f2; --smuted:#8a90ab; --edge:#4a5277;
           background:radial-gradient(1400px 800px at 30% 25%, #151b36 0%, var(--sbg) 62%); }
  #g { display:block; width:100%; height:100%; cursor:grab; } #g:active { cursor:grabbing; }
  .legend { position:absolute; top:14px; left:18px; display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center;
            color:var(--smuted); font-size:13px; background:rgba(11,14,26,.9);
            border:1px solid #232946; border-radius:10px; padding:8px 14px; max-width:calc(100% - 36px); }
  .legend span { display:inline-flex; align-items:center; gap:7px; }
  .sw { width:12px; height:12px; border-radius:50%; border:2px solid; box-shadow:0 0 8px currentColor; }
  .ln { width:26px; height:0; border-top:2px solid var(--smuted); } .ln.d { border-top-style:dashed; }
  .legend .hint { color:#626984; }
  .domain-label { fill:var(--sink); font-size:13px; font-weight:650; letter-spacing:.16em; }
  .lane-label { fill:var(--smuted); font-size:11px; letter-spacing:.04em; }
  .lane { stroke:#1c2344; stroke-dasharray:2 6; }
  .lane-label.empty { fill:#4d5372; }
  .lhs-bg { fill:rgba(11,14,26,.92); }
  .year line.q { stroke:#141a33; stroke-dasharray:1 5; }
  .year line { stroke:#1b2140; } .year text { fill:var(--smuted); font-size:11px; }
  .edge { fill:none; stroke:var(--edge); stroke-width:1.4; opacity:.55; transition:opacity .15s, stroke .15s; }
  .edge.b { stroke-dasharray:4 4; }
  .node .core { fill:#0f1324; stroke-width:2; }
  .node .halo { fill:none; stroke-width:1; stroke-dasharray:3 4; opacity:.45; }
  .node .soft { fill:none; stroke-width:6; opacity:.18; }   /* cheap 'glow': a wide faint stroke, no SVG filter */
  .node .hit { fill:transparent; }
  .node.pinned .halo { opacity:1; stroke-width:1.6; stroke-dasharray:none; }
  .node text { fill:var(--sink); font-size:13px; font-weight:500; paint-order:stroke; stroke:var(--sbg); stroke-width:4px; stroke-linejoin:round; pointer-events:none; }
  .node { cursor:pointer; transition:opacity .15s; }
  svg.focus .node:not(.on) { opacity:.16; } svg.focus .edge:not(.on) { opacity:.06; }
  svg.focus .edge.on { stroke:#e6e8f2; opacity:.95; stroke-width:1.8; }
  /* hover card: same look as the table's expanded row */
  #card { position:fixed; z-index:5; width:340px; right:18px; bottom:18px; pointer-events:none; opacity:0; transition:opacity .1s;
          background:var(--panel); color:var(--ink); border:1px solid var(--rule); border-radius:10px; padding:12px 14px;
          box-shadow:0 12px 32px rgba(0,0,0,.35); font-size:13px; line-height:1.45; }
  #card h3 { margin:0 0 6px; font-size:15px; } #card h3 small { color:var(--muted); font-weight:500; }
  #card dl { display:grid; grid-template-columns:78px 1fr; gap:4px 10px; margin:0; } #card dt { color:var(--muted); } #card dd { margin:0; }
  #card .ref { margin-top:8px; padding-top:8px; border-top:1px solid var(--rule); color:var(--muted); }
  #card .ref i { color:var(--ink); font-style:normal; }
  #card .go { margin-top:6px; color:var(--accent); font-size:12px; } #card.pinned { pointer-events:auto; } #card.left { right:auto; left:18px; }
  #card .go a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="">
  <div><h1>Seq-Browser</h1><p>How sequencing methods descend from one another.</p></div>
  <nav><a href="index.html">Table</a><a href="family.html" aria-current="page">Family</a><a href="analysis.html">Analysis</a><a href="about.html">About</a><a href="submit.html">Submit</a></nav>
</header>
<div id="stage">
  <svg id="g" role="img" aria-label="Family graph of sequencing methods"></svg>
  <div class="legend" id="legend"></div>
</div>
<div id="card"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
// each domain owns an arc of HCL hue; its lanes are spread evenly along the arc with alternating lightness, so adjacent
// lanes differ in both hue and brightness (lane position + label carry identity too, colour is a secondary cue)
const DARC = {epigenome: [185, 315], transcriptome: [100, 168], proteome: [28, 58], genome: [330, 372], functional: [76, 92]};
const laneColour = (d, i, n) => { const [h0, h1] = DARC[d], t = n > 1 ? i / (n - 1) : .5;
  return d3.hcl((h0 + (h1 - h0) * t) % 360, 62, i % 2 ? 66 : 80).formatHex(); };
const domColour = d => laneColour(d, 0, 1);
const LANE_NAME = {"3d-genome": "3D genome", "chromatin-accessibility": "accessibility", "histone-modification": "histone marks",
  "protein-dna-binding": "protein binding", "dna-methylation": "DNA methylation", "replication-timing": "replication timing",
  "rna": "RNA", "nascent-rna": "nascent RNA", "translation": "translation", "rna-structure": "RNA structure",
  "rna-modification": "RNA modification", "rna-protein-interaction": "RNA-protein binding", "rna-chromatin-interaction": "RNA-chromatin contacts",
  "immune-repertoire": "immune repertoire", "protein": "protein", "glycan": "glycan", "genome-sequence": "genome sequence", "lineage": "lineage",
  "functional-screen": "screens & reporters", "chromatin-condensability": "condensability", "rna-rna-interaction": "RNA-RNA contacts", "microbial-composition": "microbial composition", "dna-damage": "DNA damage"};
const split = s => (s || "").split("; ").filter(Boolean);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stage = document.getElementById("stage"), card = document.getElementById("card");
stage.style.setProperty("--top", document.querySelector("header").offsetHeight + "px");

Promise.all([fetch("methods.json").then(r => r.json()), fetch("taxonomy.json").then(r => r.json())]).then(([{methods}, tax]) => {
  const nodes = methods.filter(m => m.category === "wet" && m.year).map(m => ({...m}));
  const byId = new Map(nodes.map(n => [n.id, n]));
  const links = nodes.flatMap(n => [...split(n.variant_of).map(p => ({p, c: n.id, kind: "v"})), ...split(n.builds_on).map(p => ({p, c: n.id, kind: "b"}))])
    .filter(l => byId.has(l.p));

  // lanes: one per readout actually used, grouped by domain in taxonomy order
  // every readout in the taxonomy gets a lane, even with no methods yet, so the left-hand block stays stable as the list grows
  const used = new Set(nodes.flatMap(n => split(n.readouts)));
  const domains = tax.domains;
  const W = stage.clientWidth, H = stage.clientHeight;
  // lane height grows with its busiest 2-year window (methods whose first readout is that lane), so crowded lanes get room
  const busiest = {};
  nodes.forEach(n => { const q = split(n.readouts)[0], k = `${q}|${Math.floor(n.year / 2)}`; busiest[k] = (busiest[k] || 0) + 1; });
  const laneH = q => !used.has(q) ? 40 : Math.max(72, 26 * Math.max(0, ...Object.entries(busiest).filter(([k]) => k.startsWith(q + "|")).map(([, v]) => v)));
  const laneY = {}, domainSpan = {}, laneCol = {};
  let y = 120;
  domains.forEach(d => {
    const lanes = Object.entries(tax.readouts).filter(([, dd]) => dd === d).map(([r]) => r);
    const y0 = y;
    lanes.forEach((q, i) => {
      const h = laneH(q); laneY[q] = y + h / 2; y += h;
      laneCol[q] = laneColour(d, i, lanes.length);
    });
    domainSpan[d] = [y0, y, lanes];
    y += 56;
  });
  // time axis: each year's width grows with how many methods it has, so crowded recent years spread out
  const years = d3.extent(nodes, d => d.year), perYear = d3.rollup(nodes, v => v.length, d => d.year);
  const yrs = d3.range(years[0] - 1, years[1] + 2), wts = yrs.map(y => 1 + 1.8 * Math.sqrt(perYear.get(y) || 0));
  const span = Math.max(W, 1100) * 1.6 - 230, unit = span / d3.sum(wts), xpos = new Map();
  yrs.reduce((acc, y, i) => { xpos.set(y, acc + wts[i] * unit / 2); return acc + wts[i] * unit; }, 230);
  const yw = new Map(yrs.map((y, i) => [y, wts[i] * unit]));
  const x = y => xpos.get(y);  // centre of a year (grid labels)
  const xStart = y => xpos.get(y) - yw.get(y) / 2;
  // a method sits at its publication date inside its year's slot; year-only entries sit mid-year
  const frac = n => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(n.date || ""); return m && +m[1] === n.year ? ((+m[2] - 1) * 30.4 + +m[3]) / 366 : .5; };
  const xDate = n => xStart(n.year) + frac(n) * yw.get(n.year);
  // area-true: circle AREA is proportional to citations (sqrt radius), wide range so landmark papers stand out
  const cmax = d3.max(nodes, n => n.citations || 0) || 1, r = c => 3.5 + 24 * Math.sqrt((c || 0) / cmax);
  // Which lane a method belongs in. A multi-omic method should sit with the field it grew out of, not with whichever
  // readout happens to be listed first: SeqTag (RNA + accessibility + histone marks, built on Paired-Tag, CUT&Tag and
  // ATAC-seq) belongs in the histone-marks lane, not RNA. So: of this method's readouts, take the one the most of its
  // DIRECT parents also measure. Direct, not transitive - every lineage eventually reaches RNA-seq/ChIP-seq roots, which
  // would drown the signal. Ties and parentless methods fall back to the first-listed (primary) readout.
  const parentsOf = n => [...split(n.variant_of), ...split(n.builds_on)].filter(p => byId.has(p));
  function laneReadout(n) {
    const rs = split(n.readouts), ps = parentsOf(n).map(p => split(byId.get(p).readouts));
    if (!ps.length) return rs[0];
    const score = r => ps.filter(a => a.includes(r)).length;
    const best = Math.max(...rs.map(score));
    return best === 0 ? rs[0] : rs.find(r => score(r) === best);   // rs order breaks ties, so the primary still wins
  }

  nodes.forEach(n => {
    n.doms = split(n.domains); n.lw = n.name.length * 7 + 10; n.r = r(n.citations || 0);
    n.ty = laneY[laneReadout(n)];  // lane = the readout its lineage is built on (see laneReadout); arcs show the others
    n.x = xDate(n); n.y = n.ty + (Math.random() - .5) * 20;
  });

  // node + its right-hand label as a box; overlapping boxes are pushed apart vertically (x stays pinned to year)
  function labelBoxes(alpha) {
    const box = n => [n.x - n.r - 4, n.x + n.r + n.lw, Math.max(n.r, 9) + 4];
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j], [ax0, ax1, ah] = box(a), [bx0, bx1, bh] = box(b);
      if (ax1 < bx0 || bx1 < ax0) continue;
      const dy = b.y - a.y, need = ah + bh;
      if (Math.abs(dy) < need) { const push = (need - Math.abs(dy)) / 2 * alpha * 1.2, s = dy >= 0 ? 1 : -1; a.y -= push * s; b.y += push * s; }
    }
  }
  const sim = d3.forceSimulation(nodes)
    .force("x", d3.forceX(d => xDate(d)).strength(1))
    .force("y", d3.forceY(d => d.ty).strength(.45))
    .force("collide", d3.forceCollide(d => d.r + 6).iterations(2))
    .force("labels", labelBoxes).stop();
  for (let i = 0; i < 600; i++) sim.tick();
  nodes.forEach(n => n.x = xDate(n));  // snap back so the time axis stays exact
  for (let i = 0; i < 40; i++) labelBoxes(1);  // final pass: separate any labels that still touch

  const svg = d3.select("#g"), root = svg.append("g");

  // year grid, lanes, and "EPIGENOME (3D genome, ...)" style labels on the left
  const top = d3.min(nodes, n => n.y) - 50, bottom = d3.max(nodes, n => n.y) + 40;
  const yg = root.append("g").attr("class", "year");
  d3.range(years[0], years[1] + 1).forEach(yr => {
    const w = yw.get(yr), labelled = w > 46 || yr % 2 === 0;
    yg.append("line").attr("x1", xStart(yr)).attr("x2", xStart(yr)).attr("y1", top + 14).attr("y2", bottom).attr("opacity", labelled ? 1 : .5);
    if (labelled) yg.append("text").attr("x", x(yr)).attr("y", top).attr("text-anchor", "middle").text(yr);
    if (w > 160) [1, 2, 3].forEach(q => yg.append("line").attr("class", "q").attr("x1", xStart(yr) + q * w / 4).attr("x2", xStart(yr) + q * w / 4)
      .attr("y1", top + 14).attr("y2", bottom));  // quarter guides in the spread-out recent years
  });
  // frozen left panel: domain + lane labels follow vertical zoom/pan only; the plot scrolls horizontally underneath
  const PANEL = 190, lhsBg = svg.append("rect").attr("class", "lhs-bg").attr("x", 0).attr("y", 0).attr("width", PANEL).attr("height", "100%");
  const lhs = svg.append("g").attr("class", "lhs");
  domains.forEach(d => {
    const [y0, y1, lanes] = domainSpan[d];
    lhs.append("text").attr("class", "domain-label").attr("x", 20).attr("data-y", y0 - 12).style("fill", domColour(d)).text(d.toUpperCase());
    lanes.forEach(q => {
      root.append("line").attr("class", "lane").attr("x1", xStart(years[0] - 1)).attr("x2", x(years[1] + 1)).attr("y1", laneY[q]).attr("y2", laneY[q])
        .attr("opacity", used.has(q) ? 1 : .45);
      lhs.append("circle").attr("cx", 26).attr("data-y", laneY[q]).attr("r", 4).attr("fill", laneCol[q]).attr("opacity", used.has(q) ? 1 : .35);
      lhs.append("text").attr("class", "lane-label" + (used.has(q) ? "" : " empty")).attr("x", 38).attr("data-y", laneY[q] + 4).text(LANE_NAME[q] || q);
    });
  });

  const edge = root.append("g").selectAll("path").data(links).join("path")
    .attr("class", d => `edge ${d.kind}`)
    .attr("d", d => { const a = byId.get(d.p), b = byId.get(d.c), mx = (a.x + b.x) / 2;
      return `M${a.x},${a.y} C${mx},${a.y} ${mx},${b.y} ${b.x},${b.y}`; });

  const node = root.append("g").selectAll("g").data(nodes).join("g").attr("class", "node").attr("transform", d => `translate(${d.x},${d.y})`);
  node.each(function (d) {
    const g = d3.select(this), rs = split(d.readouts), n = rs.length;
    g.append("rect").attr("class", "hit").attr("x", -d.r - 6).attr("y", -Math.max(d.r, 9) - 4)
      .attr("width", 2 * d.r + 12 + d.lw).attr("height", 2 * Math.max(d.r, 9) + 8);  // hover/click target: dot + name
    g.append("circle").attr("class", "soft").attr("r", d.r + 1).attr("stroke", laneCol[rs[0]]);
    if (n === 1) g.append("circle").attr("class", "core").attr("r", d.r).attr("stroke", laneCol[rs[0]]);
    else {  // multiomic: one arc per readout, in that readout's lane colour
      g.append("circle").attr("class", "core").attr("r", d.r).attr("stroke", "none");
      const arc = d3.arc().innerRadius(d.r - 1).outerRadius(d.r + 1.5).padAngle(.1);
      rs.forEach((q, i) => g.append("path").attr("d", arc({startAngle: i * 2 * Math.PI / n, endAngle: (i + 1) * 2 * Math.PI / n}))
        .attr("fill", laneCol[q]));
    }
    g.append("circle").attr("class", "halo").attr("r", d.r + 5).attr("stroke", laneCol[rs[0]]);
    g.append("text").attr("x", d.r + 7).attr("y", 4).text(d.name);
  });

  // legend
  document.getElementById("legend").innerHTML =
    domains.map(d => { const n = Object.values(tax.readouts).filter(x => x === d).length, cs = d3.range(n).map(i => laneColour(d, i, n));
      return `<span><i style="display:inline-block;width:30px;height:10px;border-radius:5px;background:linear-gradient(90deg,${(cs.length > 1 ? cs : [cs[0], cs[0]]).join(",")})"></i>${d[0].toUpperCase() + d.slice(1)}</span>`; }).join("") +
    `<span><i class="ln"></i>variant of</span><span><i class="ln d"></i>builds on</span>` +
    `<span>citations (area) ${[[100, "100"], [1000, "1k"], [5000, "5k"], [cmax, d3.format(".2~s")(cmax).replace("k", "k")]].map(([c, lab]) =>
      `<svg width="${2 * r(c) + 4}" height="${2 * r(cmax) + 6}" style="vertical-align:middle"><circle cx="${r(c) + 2}" cy="${r(cmax) + 3}" r="${r(c)}" fill="none" stroke="#8a90ab" stroke-width="1.5"/></svg>${lab}`).join(" ")}</span>` +
    `<span class="hint">hover a method to trace its lineage · click to pin it (click again, empty space or Esc to release) · double-click to open in the table · scroll to move through time · pinch or ctrl+scroll to zoom</span>`;

  // hover: highlight every ancestor + descendant, show the card
  const up = new Map(nodes.map(n => [n.id, links.filter(l => l.c === n.id).map(l => l.p)]));
  const down = new Map(nodes.map(n => [n.id, links.filter(l => l.p === n.id).map(l => l.c)]));
  const walk = (id, m, seen = new Set()) => { (m.get(id) || []).forEach(t => { if (!seen.has(t)) { seen.add(t); walk(t, m, seen); } }); return seen; };
  const names = s => split(s).map(i => esc(byId.get(i)?.name || i)).join(", ");
  const tags = d => [...split(d.readouts), ...split(d.resolution), d.scope, ...split(d.chemistry)].map(t => `<span class="tag">${esc(t)}</span>`).join("");
  let pinned = null;
  const show = d => {
    const on = new Set([d.id, ...walk(d.id, up), ...walk(d.id, down)]);
    svg.classed("focus", true); node.classed("on", n => on.has(n.id)); edge.classed("on", l => on.has(l.p) && on.has(l.c));
    node.classed("pinned", n => pinned === n.id);
    card.innerHTML = `<h3>${esc(d.name)} <small>· ${d.year}</small></h3><dl>
      <dt>Tags</dt><dd>${tags(d)}</dd>
      ${d.variant_of ? `<dt>Variant of</dt><dd>${names(d.variant_of)}</dd>` : ""}
      ${d.builds_on ? `<dt>Builds on</dt><dd>${names(d.builds_on)}</dd>` : ""}
      ${d.children ? `<dt>Led to</dt><dd>${names(d.children)}</dd>` : ""}
      <dt>Citations</dt><dd>${d.citations != null ? d.citations.toLocaleString() : "–"}</dd></dl>
      <div class="ref"><i>${esc(d.title || "")}</i><br>${esc(d.first_author)} … ${esc(d.last_author)}, ${esc(d.journal)} ${d.year}</div>
      <div class="go">${pinned === d.id ? `Pinned · <a href="index.html#${encodeURIComponent(d.id)}">open in the table →</a>` : "Click to pin · double-click to open in the table"}</div>`;
    card.classList.toggle("pinned", pinned === d.id); card.style.opacity = 1;
  };
  const clear = () => { svg.classed("focus", false); node.classed("on", false).classed("pinned", false); edge.classed("on", false);
    card.style.opacity = 0; card.classList.remove("pinned"); };
  const release = () => { pinned = null; clear(); };
  node.on("mouseenter", (e, d) => { if (!pinned) show(d); })
    .on("mousemove", e => card.classList.toggle("left", e.clientX > innerWidth - 400 && e.clientY > innerHeight - 320))  // dodge the cursor
    .on("mouseleave", () => { if (!pinned) clear(); })
    .on("click", (e, d) => { e.stopPropagation(); if (pinned === d.id) { release(); show(d); } else { pinned = d.id; show(d); } })
    .on("dblclick", (e, d) => { e.stopPropagation(); location.href = `index.html#${encodeURIComponent(d.id)}`; });
  svg.on("click", () => { if (pinned) release(); });
  addEventListener("keydown", e => { if (e.key === "Escape" && pinned) release(); });

  // zoom/pan: start fitted to the full HEIGHT (all lanes visible), plot starts right of the frozen panel; wheel/trackpad
  // scrolls through time with eased motion, pinch / ctrl+wheel zooms
  const bb = root.node().getBBox(), pad = 30, topPad = document.getElementById("legend").offsetHeight + 34;
  // open at a readable size (text >= ~11px); lanes that do not fit scroll vertically, time scrolls sideways
  const kFit = Math.max(.85, Math.min((H - topPad - pad) / (bb.height + pad), 1.25)), kMin = .45;
  // left panel stays full size: labels only follow the plot's vertical position
  const lhsItems = lhs.selectAll("[data-y]");
  const zoom = d3.zoom().scaleExtent([kMin, 4])
    .translateExtent([[bb.x - pad - PANEL / kMin, bb.y - topPad / kMin], [bb.x + bb.width + pad, bb.y + bb.height + pad]])
    .on("zoom", e => { const t = e.transform; root.attr("transform", t);
      lhsItems.each(function () { const el = d3.select(this), v = +el.attr("data-y") * t.k + t.y; el.attr(this.tagName === "circle" ? "cy" : "y", v); }); });
  zoom.filter(e => (e.type !== "wheel" || e.ctrlKey) && !e.button);
  let want = null, raf = 0;  // eased scrolling: wheel sets a target, frames glide toward it
  const glide = () => { const t = d3.zoomTransform(svg.node()), dx = want[0] - t.x, dy = want[1] - t.y;
    if (Math.abs(dx) + Math.abs(dy) < .5) { raf = 0; want = null; return; }
    zoom.translateBy(svg, dx * .22 / t.k, dy * .22 / t.k); const n = d3.zoomTransform(svg.node());
    if (Math.abs(n.x - t.x) + Math.abs(n.y - t.y) < .05) { raf = 0; want = null; return; }  // hit the edge
    raf = requestAnimationFrame(glide); };
  svg.call(zoom).on("dblclick.zoom", null)
    .on("wheel.scroll", e => { if (e.ctrlKey) return; e.preventDefault();
      const t = d3.zoomTransform(svg.node()), tall = bb.height * t.k > H - topPad;
      // vertical wheel moves through time unless the lanes are taller than the screen (then shift+wheel or horizontal swipe moves time)
      const dx = e.deltaX || (!tall || e.shiftKey ? e.deltaY : 0), dy = tall && !e.shiftKey && !e.deltaX ? e.deltaY : 0;
      want = want || [t.x, t.y]; want = [want[0] - dx, want[1] - dy];
      if (!raf) raf = requestAnimationFrame(glide); }, {passive: false});
  svg.call(zoom.transform, d3.zoomIdentity.translate(PANEL - (bb.x - pad) * kFit + 10, topPad - bb.y * kFit).scale(kFit));
});
</script>
</body>
</html>
