<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submit a Method</title>
<meta name="description" content="Suggest a sequencing-based method for Seq-Browser.">
<link rel="icon" href="brand/seqbrowser-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=20261112-0440">
<style>
  form { max-width:760px; display:grid; grid-template-columns:1fr 1fr; gap:14px 18px; margin-top:16px; }
  label { display:flex; flex-direction:column; gap:4px; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  input[type=text], select, textarea { font:inherit; font-size:15px; text-transform:none; letter-spacing:0; font-weight:400; padding:9px 11px; border:1px solid var(--rule); border-radius:8px; background:var(--panel); color:var(--ink); }
  textarea { min-height:110px; resize:vertical; }
  .full { grid-column:1 / -1; }
  fieldset { border:1px solid var(--rule); border-radius:8px; padding:10px 12px; margin:0; }
  legend { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:0 4px; }
  fieldset label { flex-direction:row; align-items:center; gap:6px; display:inline-flex; margin:3px 14px 3px 0; text-transform:none; letter-spacing:0; font-weight:400; font-size:14px; color:var(--ink); }
  button { grid-column:1 / -1; justify-self:start; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; }
  .note { max-width:760px; color:var(--muted); font-size:14px; }
  @media (max-width:760px) { form { grid-template-columns:1fr; } }
</style>
<meta property="og:type" content="website"><meta property="og:site_name" content="Seq-Browser"><meta property="og:title" content="Submit a Method"><meta property="og:description" content="Suggest a sequencing-based method for Seq-Browser."><meta property="og:url" content="https://robertt4n.github.io/Seq-Browser/submit.html"><meta property="og:image" content="https://robertt4n.github.io/Seq-Browser/brand/seqbrowser-og.png"><meta property="og:image:width" content="600"><meta property="og:image:height" content="600"><meta name="twitter:card" content="summary"><meta name="twitter:image" content="https://robertt4n.github.io/Seq-Browser/brand/seqbrowser-og.png">
</head>
<body>
<header>
  <a class="logo" href="index.html" aria-label="Seq-Browser home"><picture><source media="(prefers-color-scheme: dark)" srcset="brand/seqbrowser-icon-dark.svg"><img src="brand/seqbrowser-icon.svg" alt="Seq-Browser logo"></picture></a>
  <div><h1>Seq-Browser</h1><p>Please suggest a method for the database, or how we can improve!</p></div>
  <nav><a href="index.html">Table</a><a href="family.html">Family</a><a href="analysis.html">Analysis</a><a href="about.html">About</a><a href="submit.html" aria-current="page">Submit</a></nav>
</header>
<main>
  <p class="note">Missing a method? Submissions are prioritized in the weekly collection and classification (see <a href="about.html">About</a>).</p>
  <form id="f">
    <label>Method name *<input type="text" name="name" id="nm" required placeholder="e.g. Droplet Hi-C"></label>
    <label>DOI(s) *<input type="text" name="doi" required placeholder="paper and/or preprint"></label>
    <label>Type<select name="category" id="cat"><option>Wet-lab assay / protocol</option><option>Computational method</option></select></label>
    <label>Protocol or code link<input type="text" name="protocol" placeholder="protocols.io / GitHub"></label>
    <fieldset class="full"><legend id="rl">What does it measure?</legend>
      <label><input type="checkbox" name="readouts" value="3D genome">3D genome</label><label><input type="checkbox" name="readouts" value="Chromatin accessibility">Chromatin accessibility</label>
      <label><input type="checkbox" name="readouts" value="Histone modifications">Histone modifications</label><label><input type="checkbox" name="readouts" value="Protein-DNA binding">Protein-DNA binding</label>
      <label><input type="checkbox" name="readouts" value="DNA methylation">DNA methylation</label><label><input type="checkbox" name="readouts" value="RNA">RNA</label>
      <label><input type="checkbox" name="readouts" value="Protein">Protein</label><label><input type="checkbox" name="readouts" value="Other">Other / not sure</label>
    </fieldset>
    <fieldset class="full" id="taskfs" hidden><legend>What does it do?</legend>
      <label><input type="checkbox" name="task" value="preprocessing-qc">Preprocessing / quality control</label><label><input type="checkbox" name="task" value="integration">Integration / batch correction</label><label><input type="checkbox" name="task" value="multimodal-integration">Multimodal integration</label><label><input type="checkbox" name="task" value="clustering-annotation">Clustering / cell-type annotation</label><label><input type="checkbox" name="task" value="trajectory-velocity">Trajectory / RNA velocity</label><label><input type="checkbox" name="task" value="regulatory-networks">Regulatory networks</label><label><input type="checkbox" name="task" value="cell-communication">Cell-cell communication</label><label><input type="checkbox" name="task" value="spatial-analysis">Spatial analysis</label><label><input type="checkbox" name="task" value="perturbation-modelling">Perturbation modelling</label><label><input type="checkbox" name="task" value="variants-clones">Variants / clones</label><label><input type="checkbox" name="task" value="differential-analysis">Differential analysis</label><label><input type="checkbox" name="task" value="foundation-model">Foundation model</label><label><input type="checkbox" name="task" value="dimensionality-visualization">Embedding / visualisation</label><label><input type="checkbox" name="task" value="benchmark-infrastructure">Benchmark / infrastructure</label><label><input type="checkbox" name="task" value="3d-genome-analysis">3D genome analysis</label><label><input type="checkbox" name="task" value="modification-calling">Modification calling</label><label><input type="checkbox" name="task" value="metagenomics-taxonomy">Metagenomics / taxonomy</label><label><input type="checkbox" name="task" value="genome-assembly">Genome assembly</label><label><input type="checkbox" name="task" value="sequence-to-function">Sequence-to-function</label><label><input type="checkbox" name="task" value="disease-classification">Disease classification</label><label><input type="checkbox" name="task" value="other">Other / not sure</label>
    </fieldset>
    <fieldset class="full"><legend>Resolution</legend>
      <label><input type="checkbox" name="resolution" value="Bulk">Bulk</label><label><input type="checkbox" name="resolution" value="Single-cell">Single-cell</label>
      <label><input type="checkbox" name="resolution" value="Spatial">Spatial</label><label><input type="checkbox" name="resolution" value="Subcellular">Subcellular</label><label><input type="checkbox" name="resolution" value="Temporal">Temporal</label>
    </fieldset>
    <label class="full">Related / parent methods<input type="text" name="parents" placeholder="what it is a variant of or builds on, e.g. in situ Hi-C, 10x scATAC"></label>
    <label class="full">Notes<textarea name="notes" placeholder="anything worth knowing, e.g. where in the paper the method is introduced"></textarea></label>
    <button type="submit">Submit</button>
  </form>
</main>
<script>
// Submissions go to a Google Form used only as a mailbox (responses land in a Google Sheet the weekly pipeline reads).
// Visitors never leave this page and need no account.
const FORM = "https://docs.google.com/forms/d/e/1FAIpQLSfe_usde4JB1zl45D2VWBoCuu-HeVGxjxuIzxkrlgiUQn2BOQ/formResponse";
const ENTRY = {name: 92676153, doi: 876010685, category: 651749802, protocol: 1264550092, readouts: 1614318311,
               resolution: 1307065276, parents: 1600325334, notes: 672298552};
// computational methods: "what data does it analyse" instead of "what does it measure", plus a task list
const cat = document.getElementById("cat"), setType = () => {
  const comp = cat.value.startsWith("Comp");
  document.getElementById("rl").textContent = comp ? "What data does it analyse?" : "What does it measure?";
  document.getElementById("nm").placeholder = comp ? "e.g. Diffusion pseudotime" : "e.g. Droplet Hi-C";
  document.getElementById("taskfs").hidden = !comp;
};
cat.onchange = setType; setType();
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const fd = new FormData(e.target), body = new URLSearchParams(), btn = e.target.querySelector("button");
  const tasks = fd.getAll("task");   // the mailbox form has no task field, so tasks travel at the start of the notes
  if (cat.value.startsWith("Comp") && tasks.length) fd.set("notes", `Task: ${tasks.join(", ")}\n` + (fd.get("notes") || ""));
  for (const [k, id] of Object.entries(ENTRY)) body.append(`entry.${id}`, fd.getAll(k).join(", "));
  btn.disabled = true; btn.textContent = "Sending…";
  try {
    await fetch(FORM, {method: "POST", mode: "no-cors", body});  // opaque response by design; reaching here = sent
    e.target.outerHTML = `<div class="note" style="max-width:760px;margin-top:16px;padding:16px;border:1px solid var(--rule);border-radius:10px;background:var(--panel)">
      <b>Thank you!</b> Your suggestion has been submitted and will be prioritized in the next weekly update.
      <br><a href="submit.html">Submit another</a></div>`;
  } catch {
    btn.disabled = false; btn.textContent = "Submit";
    alert("Couldn't reach the submission service. Please check your connection and try again.");
  }
};
</script>
<script src="visitor-counter.js?v=20261028-counter3" defer></script>
</body>
</html>
