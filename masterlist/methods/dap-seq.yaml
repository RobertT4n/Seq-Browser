evidence: To enable low-cost, high-throughput generation of cistrome and epicistrome maps for any organism, we developed DNA
  affinity purification sequencing (DAP-seq), a transcription factor (TF)-binding site (TFBS) discovery assay that couples
  affinity-purified TFs with next-generation sequencing of a genomic DNA library.
