evidence: 'Here we developed two interspecies constraint metrics across 462 mammalian species: Gene Identity Score of Mammalian
  Orthologs (GISMO), which quantifies gene loss weighted by evolutionary distance to humans, and GISMO-mis, which measures
  missense constraint using the ratio of missense to synonymous variation across mammals.'
