evidence: Leveraging the high-confidence A-to-I editing sites identified by REX-seq, we developed InoDREAM, which successfully
  predicted multiple regulatory proteins that exhibit specific binding affinity to A-to-I edited transcripts while simultaneously
  identifying disease-associated mutation sites and relevant cis-regulatory elements that are functionally linked to RNA editing
  events.
