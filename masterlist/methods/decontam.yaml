evidence: 'Here we introduce decontam ( https://github.com/benjjneb/decontam ), an open-source R package that implements a
  statistical classification procedure that identifies contaminants in MGS data based on two widely reproduced patterns: contaminants
  appear at higher frequencies in low-concentration samples and are often found in negative controls.'
