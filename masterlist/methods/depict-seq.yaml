evidence: Here, we present Double Emulsion PCR-Initiated Cell sorting and Transcriptomic Sequencing (DEPICT-seq), a high-throughput
  droplet nucleic acid cytometry method that integrates batch cell fixation for cellular information preservation, double
  emulsion digital PCR-based cell sorting to target nucleic acid markers of interest, and in-depth full-length transcriptomic
  analyses at single-cell resolution.
