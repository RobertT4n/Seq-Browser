evidence: In this work we present RNentropy, a methodology based on information theory devised for this task, which given
  expression estimates from any number of RNA-Seq samples and conditions identifies genes or transcripts with a significant
  variation of expression across all the conditions studied, together with the samples in which they are over- or under-expressed.
