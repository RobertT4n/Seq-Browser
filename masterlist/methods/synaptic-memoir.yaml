name: Synaptic MEMOIR
full_name: memory with engineered mutagenesis with optical in situ readout (synaptic)
category: wet
summary: Continuous mutagenesis generates protein barcodes that are transported to synapses so synapses can be matched to
  cell-body barcodes by optical imaging, mapping neuronal projections at single-synapse resolution.
