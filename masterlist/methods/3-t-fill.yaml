evidence: Here, we present a method to identify poly(A) sites in a genome-wide and strand-specific manner. This method, termed
  3'T-fill, initially fills in the poly(A) stretch with unlabeled dTTPs, allowing sequencing to start directly after the poly(A)
  tail into the 3'-untranslated regions (UTR).
