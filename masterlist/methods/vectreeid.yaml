evidence: We present a standardised informatic pipeline for analysis of DNA barcoding data from dipteran vectors, VecTreeID,
  that uses short-read amplicon sequencing (AmpSeq) coupled with sequence similarity assessment (BLAST) and an evolutionary
  placement algorithm (EPA-ng) to achieve vector taxonomic identification.
