evidence: EDGE-pro (Estimated Degree of Gene Expression in PROkaryotes) processes the raw data from an RNA-seq experiment
  on a bacterial or archaeal species and produces estimates of the expression levels for each gene in these gene-dense genomes.SoftwareThe
  EDGE-pro tool is implemented as a pipeline of C++ and Perl programs and is freely available as open-source code at http://www.genomics.jhu.edu/software
