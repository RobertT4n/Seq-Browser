name: CLIP-PE
full_name: Cre-LoxP Inverse PCR Paired-End
category: wet
summary: Mate-pair library construction that circularizes large DNA fragments by Cre-LoxP recombination and enriches both
  ends by inverse PCR, giving inserts up to 22 kb.
