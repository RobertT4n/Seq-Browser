evidence: We developed a new approach, Cre-LoxP Inverse PCR Paired-End (CLIP-PE), which exploits the advantages of (1) Cre-LoxP
  recombination system to efficiently circularize large DNA fragments, (2) inverse PCR to enrich for the desired products
  that contain both ends of the large DNA fragments, and (3) the use of restriction enzymes to introduce a recognizable junction
  site.
