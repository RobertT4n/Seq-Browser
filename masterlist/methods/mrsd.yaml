name: MRSD
full_name: minimum required sequencing depth
category: dry
summary: Gene- and tissue-specific metric estimating the RNA-seq depth needed to reach a chosen coverage of a gene, to judge
  feasibility of detecting mis-splicing in Mendelian disease.
