evidence: The lack of well-validated bioinformatic pipelines for CH calling may contribute to lack of reproducibility in studies
  of CH.ResultsHere, we developed ArCH, an Artifact filtering Clonal Hematopoiesis variant calling pipeline for detecting
  single nucleotide variants and short insertions/deletions by combining the output of four variant calling tools and filtering
  based on variant characteristics and sequencing error rate estimation.
