shared_doi: MAD-seq (wet) and MADSEQ (dry) are two methods in one paper
evidence: We describe the mosaic aneuploidy detection by massively parallel sequencing (MAD-seq) capture assay and the MADSEQ
  analytical approach that allow low (<10%) levels of mosaicism for chromosomal aneuploidy or regional loss of heterozygosity
  to be detected, assigned to a meiotic or mitotic origin, and quantified as a proportion of the cells in the sample.
