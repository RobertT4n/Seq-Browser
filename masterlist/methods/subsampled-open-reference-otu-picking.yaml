name: Subsampled open-reference OTU picking
category: dry
summary: Algorithm that assigns 16S rRNA amplicon reads to OTUs by subsampling, so most clustering runs in parallel while
  all reads are still matched against references.
readouts:
- microbial-composition
resolution:
- bulk
scope: targeted
evidence: We present a performance-optimized algorithm, subsampled open-reference OTU picking, for assigning marker gene (e.g.,
  16S rRNA) sequences generated on next-generation sequencing platforms to operational taxonomic units (OTUs) for microbial
  community analysis.
