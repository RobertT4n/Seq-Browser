evidence: Leveraging over 11,000 transcriptome samples, the circadian time-course profiling, the simulation-based algorithm
  optimisation, and the experimental validation, we developed SPIRAL, an online single time-point circadian analysis platform
  for rice and unexpectedly revealed a ∼28-hour endogenous rhythm in V4-stage Nipponbare leaves, making period-matched or
  long-day photoperiods comparatively more permissive growth conditions for the assayed experimental system.
