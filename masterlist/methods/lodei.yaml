evidence: We introduce the local differential editing index (LoDEI) to detect differential A-to-I editing in RNA-seq datasets
  using a sliding-window approach coupled with an empirical q value calculation that detects more A-to-I editing sites at
  the same false-discovery rate compared to existing methods.
