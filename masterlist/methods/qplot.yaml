evidence: Importantly, since NGS technologies and protocols are rapidly evolving, with constantly changing steps ranging from
  sample preparation to data processing software updates, it is important to enable researchers to routinely assess the quality
  of sequencing and alignment data prior to downstream analyses.ResultsHere we describe QPLOT, an automated tool that can
  facilitate the quality assessment of sequencing run performance.
