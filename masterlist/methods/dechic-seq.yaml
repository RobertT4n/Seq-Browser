evidence: Here, we establish DeChIC-seq (DNA Deaminase-based Chromatin Immuno-Conversion sequencing), a conversion-based strategy that uses a protein A-DddAtox fusion to directly record protein-DNA interactions by inducing localized C-to-U conversions near antibody-bound chromatin.
