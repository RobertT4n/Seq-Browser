name: Alleleauto
category: dry
summary: Workflow that identifies true allelic gene pairs in haplotype-resolved diploid assemblies, filtering paralogs by
  Ks and synteny, and runs allele-specific expression analysis.
readouts:
- genome-sequence
- rna
resolution:
- bulk
scope: genome-wide
evidence: In this study, we developed Alleleauto, a workflow integrating the parametric 3σ rule and the non-parametric Tukey's
  method as two complementary outlier detection methods to precisely identify alleles and perform ASE analysis from haplotype-resolved
  assemblies.
