evidence: Here, as part of the ICGC/TCGA Pan-Cancer Analysis of Whole Genomes (PCAWG) Consortium, which aggregated whole-genome
  sequencing data from 2658 cancers across 38 tumour types, we present TrackSig, a new method that reconstructs these trajectories
  using optimal, joint segmentation and deconvolution of mutation type and allele frequencies from a single tumour sample.
