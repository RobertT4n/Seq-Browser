evidence: Here, we introduce SURVIVOR_ant, a tool that compares types and breakpoints for candidate SVs from different callsets
  and enables fast comparison of SVs to genomic features such as genes and repetitive regions, as well as to previously established
  SV datasets such as from the 1000 Genomes Project.
