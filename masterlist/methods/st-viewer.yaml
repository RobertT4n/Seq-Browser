evidence: This novel type of data opens up many possibilities for analysis and visualization, most of which are either not
  available with standard tools or too complex for normal users.<h4>Results</h4>Here, we present a tool, ST Viewer, which
  allows real-time interaction, analysis and visualization of Spatial Transcriptomics datasets through a seamless and smooth
  user interface.<h4>Availability and implementation</h4>The ST Viewer is open source under a MIT license and it is available
  at https://github.com/SpatialTranscriptomicsResearch/st_viewer.<h4>Supplementary information</h4>Supplementary data are
  available at Bioinformatics online.
