name: cP-RNA-seq
full_name: cyclic-phosphate RNA sequencing
category: wet
summary: Periodate treatment after phosphatase removes the 3' ends of all small RNAs except those with a 2',3'-cyclic phosphate,
  so only tRNA halves and other cP-RNAs are ligated, amplified and sequenced.
