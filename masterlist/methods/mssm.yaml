evidence: Here, we introduce Micro-Scale Spatial Metagenomics (MSSM), a new methodological framework that couples laser micro-dissection
  of tissue sections, ultra-low-input library preparation, and genome-resolved bioinformatics to reconstruct microbial communities
  from intestinal microsamples measuring as little as ∼500 µm² (≈100 bacterial cells).
