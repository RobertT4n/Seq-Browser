evidence: Here we introduce pertTF, a transformer-based single-cell genetic perturbation model. pertTF was trained from a
  unique dataset capturing single cell expressions profiles of 30 full gene knockouts across 14 relevant cell types during
  human pancreatic development and beta-cell differentiation. pertTF outperforms current methods in predicting expression
  changes of perturbing unseen genes in unseen cellular contexts.
