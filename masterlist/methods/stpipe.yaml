evidence: To address the need for simpler, open-source solutions that deal with sequencing-based spatial transcriptomics (sST)
  data from different platforms, we present stPipe, a comprehensive and modular preprocessing pipeline for all current mainstream
  sST platforms. stPipe is implemented as an R/Bioconductor package that handles various analysis steps, including (i) data
  processing from raw FASTQ files to create a spatially resolved gene count matrix; (ii) the collation of relevant quality
  control metrics to ensure unwanted artifacts can be filtered; and (iii) the adoption of standardized data storage containers
  to allow results to be easily passed on to a wide range of downstream analysis packages.
