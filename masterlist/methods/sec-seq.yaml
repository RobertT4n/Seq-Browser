evidence: Here, by developing and using secretion-encoded single-cell sequencing (SEC-seq), which exploits hydrogel particles
  with subnanolitre cavities (nanovials) to capture individual cells and their secretions, we simultaneously measured the
  secretion of vascular endothelial growth factor A (VEGF-A) and the transcriptome for thousands of individual mesenchymal
  stromal cells.
