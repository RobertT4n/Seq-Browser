evidence: However, accurate inference of protein occupancy requires higher-resolution footprinting analysis where major hurdles
  exist, including the sequence bias of nucleases and the short-lived chromatin binding of many transcription factors (TFs)
  with consequent lack of footprints.ResultsHere we introduce an assay termed cross-link (XL)-DNase-seq, designed to capture
  chromatin interactions of dynamic TFs.
