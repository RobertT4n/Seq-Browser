evidence: We developed FragMIL, a fragment-token multiple-instance learning framework that represents each cfDNA molecule
  as a learnable token integrating end-motif, genomic-position, and fragment-length information, and aggregates thousands
  of fragment tokens into a patient-level cancer score.
