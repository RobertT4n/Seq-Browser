evidence: Here, we developed STR-FM, short tandem repeat profiling using flank-based mapping, a computational pipeline that
  can detect the full spectrum of STR alleles from short-read data, can adapt to emerging read-mapping algorithms, and can
  be applied to heterogeneous genetic samples (e.g., tumors, viruses, and genomes of organelles).
