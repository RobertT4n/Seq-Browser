evidence: We introduce a new cell sorting technology that robustly sorts based on sequence-specific analysis of cellular nucleic
  acids. Our approach, PCR-activated cell sorting (PACS), uses TaqMan PCR to detect nucleic acids within single cells and
  trigger their sorting.
