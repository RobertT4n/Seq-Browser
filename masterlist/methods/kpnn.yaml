evidence: Here we demonstrate deep learning on biological networks, where every node has a molecular equivalent, such as a
  protein or gene, and every edge has a mechanistic interpretation, such as a regulatory interaction along a signaling pathway.<h4>Results</h4>With
  knowledge-primed neural networks (KPNNs), we exploit the ability of deep learning algorithms to assign meaningful weights
  in multi-layered networks, resulting in a widely applicable approach for interpretable deep learning.
