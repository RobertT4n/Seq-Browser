evidence: Here, we developed a new technique by supplementing carrier materials of both chemically modified mimics with epigenetic
  marks and dUTP-containing DNA fragments during conventional ChIP procedures (hereafter referred to as 2cChIP-seq), thus
  dramatically improving immunoprecipitation efficiency and reducing DNA loss of low-input ChIP-seq samples.
