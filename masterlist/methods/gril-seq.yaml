evidence: The technique, referred to as global small non-coding RNA target identification by ligation and sequencing (GRIL-seq),
  is based on preferential ligation of sRNAs to the ends of base-paired targets in bacteria co-expressing T4 RNA ligase, followed
  by sequencing to identify the chimaeras.
