name: ConsHMM
category: dry
summary: Multivariate hidden Markov model that learns de novo conservation states from which species align to and match the
  reference in a multiple-species alignment.
readouts:
- genome-sequence
resolution:
- bulk
scope: genome-wide
evidence: Here we present a complementary whole genome annotation approach, ConsHMM, which applies a multivariate hidden Markov
  model to learn de novo 'conservation states' based on the combinatorial and spatial patterns of which species align to and
  match a reference genome in a multiple species DNA sequence alignment.
