evidence: In this work, we devised the mitochondrial dimethyl sulfate mutational profiling with sequencing (mitoDMS-MaPseq)
  method and applied detection of RNA folding ensembles using expectation-maximization (DREEM) clustering to unravel the native
  mitochondrial messenger RNA (mt-mRNA) structurome in wild-type (WT) and leucine-rich pentatricopeptide repeat-containing
  protein (LRPPRC)-deficient cells.
