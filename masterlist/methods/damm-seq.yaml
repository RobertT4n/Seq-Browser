evidence: We developed Demethylation-Assisted Multiple Methylation sequencing (DAMM-seq) to simultaneously detect N1-methyladenosine
  (m1A), N3-methylcytidine (m3C), N1-methylguanosine (m1G) and N2,N2-dimethylguanosine (m22G) methylations in both steady-state
  RNA and nascent RNA, and discovered that human ALKBH7 demethylates m22G and m1A within mt-Ile and mt-Leu1 pre-tRNA regions,
  respectively, in mitochondrial polycistronic RNA.
