evidence: To address this limitation, we developed droplet-based methods for the single-cell profiling of chromatin accessibility
  (droplet-based single-cell Nanopore ATAC-seq, dscNanoATAC) and histone modifications (droplet-based single-cell NanoCUT&Tag, dscNanoCUT)
  by combining a commercial microfluidic device and long-read sequencing platform, achieving a throughput of ~5000 cells in
  a single experiment and significantly reducing the time and costs compared with previous techniques.
