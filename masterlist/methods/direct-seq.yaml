evidence: By introducing an A/G mixed capture sequence into the gRNA scaffold, we demonstrate that gRNA transcripts could
  be directly reverse transcribed by poly (dT) primer together with the endogenous mRNA, followed by high-content molecular
  phenotyping in scRNA-seq (Direct-seq).
