  title: Single-molecule regulatory architectures captured by chromatin fiber sequencing
links: {}
how: 'Intact chromatin is treated with a non-specific N6-adenine methyltransferase (Hia5). It methylates DNA only where nucleosomes are absent, so each accessible stretch of a molecule gets m6A marks. The DNA is then sequenced on PacBio HiFi, which reads m6A directly, so one 10-20 kb read shows nucleosome positions, regulatory elements and transcription-factor footprints together with the underlying sequence and CpG methylation.'
