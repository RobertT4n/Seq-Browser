evidence: 'We introduce TACTIC, a 16S rRNA amplicon analysis tool that offers operational taxonomic unit (OTU) clustering
  (UPARSE) and zOTU inference (UNOISE3), as well as two hybrid post-denoising clustering strategies that overcome the limitations
  of each approach: Taxonomy-Informed Clustering (TIC) and Taxonomy-Agnostic Clustering (TAC).'
