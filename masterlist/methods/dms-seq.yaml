evidence: Here we present an approach for globally monitoring RNA structure in native conditions in vivo with single-nucleotide
  precision. This method is based on in vivo modification with dimethyl sulphate (DMS), which reacts with unpaired adenine
  and cytosine residues, followed by deep sequencing to monitor modifications.
