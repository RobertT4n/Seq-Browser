evidence: To address these limitations, we have recently developed a novel method, termed Single Molecule Real-Time Sequencing
  of the M protein (SMaRT M-Seq), which combines the unbiased amplification of expressed immunoglobulin genes via inverse
  PCR from circularized cDNA with long-read DNA sequencing, followed by bioinformatic and immunogenetic analyses.
