evidence: Here, we describe an open source software program "FHiTINGS" that utilizes the output of a BLASTn (blastall) search
  to rapidly identify, classify, and parse internal transcribed spacer (ITS) DNA sequences produced in fungal ecology studies
  that utilize next-generation DNA sequencing.
