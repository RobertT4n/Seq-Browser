name: Read&Tag
full_name: "Read&Tag: antibody-independent chromatin profiling with reader-domain-Tn5 fusions"
category: wet
summary: Chromatin reader domains or intrabodies fused directly to Tn5 tagment targeted chromatin in situ without antibodies, profiling histone marks, DNA methylation and elongating Pol II. Dual-specificity readers require two marks on the same fragment (e.g. H3K4me3 with H3K27me3), and primer-timed signal augmentation measures four features in one reaction.
