name: RICC-seq 2.0
full_name: Radiation-induced correlated cleavage with sequencing
category: wet
summary: Improved RICC-seq in which ionizing radiation cuts DNA in intact nuclei and co-occurring break ends are sequenced
  to read out sub-kilobase nucleosome-nucleosome contacts, cross-validated against Micro-C.
