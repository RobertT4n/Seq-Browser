evidence: To address these problems, we introduce indexing single-cell immunocleavage sequencing (iscChIC-seq), a multiplex
  indexing method based on TdT terminal transferase and T4 DNA ligase-mediated barcoding strategy and single-cell ChIC-seq,
  which is capable of readily analyzing histone modifications across tens of thousands of single cells in one experiment.
