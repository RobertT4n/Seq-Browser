evidence: We present scMGFGRN, a multi-model deep learning framework that integrates single-cell transcriptomic profiles with
  GO hierarchical relationships, gene sequences by leveraging denoising auto encoders, graph attention feature extraction
  and pertained DNA language model to capture multi-source dependencies within multi-model biological knowledge, while its
  gated multi head attention module effectively identifies informative regulatory signatures and integrate complementary features
  from different sources to predict accurate gene regulatory networks.
