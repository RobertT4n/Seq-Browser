name: ARM-seq
full_name: AlkB-facilitated RNA methylation sequencing
category: wet
summary: Pretreatment of small RNA with AlkB demethylase removes m1A, m3C and m1G so they stop blocking reverse transcription,
  giving a comparative map of tRNA and tRNA-fragment methylation.
readouts:
- rna-modification
resolution:
- bulk
scope: genome-wide
chemistry:
