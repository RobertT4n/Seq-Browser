  pmcid: PMC4553111
  title: 'ARM-seq: AlkB-facilitated RNA methylation sequencing reveals a complex landscape of modified tRNA fragments'
links: {}
added: '2026-11-14'
evidence: Here we describe AlkB-facilitated RNA methylation sequencing (ARM-seq), which uses pretreatment with Escherichia
  coli AlkB to demethylate N(1)-methyladenosine (m(1)A), N(3)-methylcytidine (m(3)C) and N(1)-methylguanosine (m(1)G), all
  commonly found in tRNAs.
