evidence: Here, we established Live-seq, a single-cell transcriptome profiling approach that preserves cell viability during
  RNA extraction using fluidic force microscopy, thus allowing to couple a cell's ground-state transcriptome to its downstream
  molecular or phenotypic behaviour.
