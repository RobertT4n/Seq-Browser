name: TChIP-seq
full_name: tandem chromatin immunoprecipitation sequencing
category: wet
summary: Chromatin is first purified through a tagged core histone expressed in the cell type of interest, then ChIP-seq gives
  cell-type-specific histone modification maps from mixed tissue.
