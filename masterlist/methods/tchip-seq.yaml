evidence: To address the cell type-specific chromatin state in a genome-wide manner, we recently developed tandem chromatin
  immunoprecipitation sequencing (tChIP-Seq), which is based on the selective purification of chromatin by tagged core histone
  proteins from cell types of interest, followed by ChIP-Seq.
