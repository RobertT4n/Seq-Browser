evidence: This method, psoralen affinity purification with genomic sequencing (Psora-seq), utilizes biotinylated psoralen
  and streptavidin-conjugated magnetic beads to facilitate efficient pull-down of psoralen-bound DNA, followed by deep sequencing
  to identify and quantify supercoiling at 1 kb resolution.
