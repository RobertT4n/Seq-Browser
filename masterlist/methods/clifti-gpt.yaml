evidence: We introduce Clifti-GPT, a privacy-preserving federated framework based on secure multi-party computation (SMPC)
  that enables collaborative model training and transferable inference, where zero-shot predictions are performed across decentralized
  clinical repositories by securely aggregating local statistics rather than transferring data embeddings, without sharing
  patient data, clinical-level statistics, or models.
