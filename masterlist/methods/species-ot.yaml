evidence: Here, frameworks that translate insights from model organisms into other species would accelerate wet-lab studies,
  so we develop Species-OT, a cross-species transcriptome analysis framework using Gromov-Wasserstein optimal transport, which
  quantitatively compares the geometry of transcriptome distributions.
