evidence: We engineered a hybrid transposase including the chromodomain (CD) of the heterochromatin protein-1α (HP-1α), which
  is involved in heterochromatin assembly and maintenance through its binding to trimethylation of the lysine 9 on histone
  3 (H3K9me3), and developed a single-cell method, single-cell genome and epigenome by transposases sequencing (scGET-seq),
  that, unlike single-cell assay for transposase-accessible chromatin with sequencing (scATAC-seq), comprehensively probes
  both open and closed chromatin and concomitantly records the underlying genomic sequences.
