name: scGET-seq
full_name: "Single-cell genome and epigenome by transposases sequencing"
category: wet
summary: Single-cell hybrid transposase (Tn5 fused to a H3K9me3-binding chromodomain) that profiles open and closed chromatin
  plus the genomic sequence in one assay.
