evidence: Here, we describe an RNA-seq protocol using Thermostable Group II Intron Reverse Transcriptases (TGIRTs), which
  have high fidelity, processivity, and strand-displacement activity, as well as a proficient template-switching activity
  that enables efficient and seamless RNA-seq adapter addition.
