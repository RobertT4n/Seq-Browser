evidence: Here, we developed polyadenylation ligation-mediated sequencing (PALM-Seq), an RNA sequencing strategy employing
  treatment of RNA with T4 polynucleotide kinase to generate cell-free RNA (cfRNA) fragments with 5' phosphate and 3' hydroxyl
  and RNase H to deplete abundant RNAs, achieving simultaneous quantification and characterization of cfRNAs.
