evidence: SV detection tools usually exhibit low agreement, are often geared toward certain types or size ranges of variation
  and struggle to correctly classify the type and exact size of SVs.ResultsWe present Gustaf (Generic mUlti-SpliT Alignment
  Finder), a sound generic multi-split SV detection tool that detects and classifies deletions, inversions, dispersed duplications
  and translocations of ≥ 30 bp.
