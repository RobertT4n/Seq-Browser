evidence: Here, as part of the ICGC/TCGA Pan-Cancer Analysis of Whole Genomes (PCAWG) Consortium, which aggregated whole genome
  sequencing data from 2658 cancers across 38 tumour types, we describe DriverPower, a software package that uses mutational
  burden and functional impact evidence to identify driver mutations in coding and non-coding sites within cancer whole genomes.
