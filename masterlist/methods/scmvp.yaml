evidence: Here, we present a multi-modal deep generative model, the single-cell Multi-View Profiler (scMVP), which is designed
  for handling sequencing data that simultaneously measure gene expression and chromatin accessibility in the same cell, including
  SNARE-seq, sci-CAR, Paired-seq, SHARE-seq, and Multiome from 10X Genomics.
