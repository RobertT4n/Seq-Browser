evidence: Here, we present Methylation Anchor Probe for Low-signal Enrichment (MAPLE), a novel technology that uses rationally
  designed, ultrasensitive short capture probes to selectively enrich low-frequency methylation haplotypes, significantly
  reducing sequencing costs while enhancing detection sensitivity.
