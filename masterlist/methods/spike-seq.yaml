evidence: In the present study, we introduce Spike-Seq, a custom amplicon-based approach for the S gene sequencing of SARS-CoV-2
  in wastewater samples, which enables not only the accurate identification of the existing Spike-related genetic markers,
  but also the estimation of their frequency in the investigated samples.
