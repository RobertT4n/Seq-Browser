evidence: In the present study, we developed PHAGE-ATAC (Assay for Transposase-Accessible Chromatin), a massively parallel
  droplet-based method that uses phage displaying, engineered, camelid single-domain antibodies ('nanobodies') for simultaneous
  single-cell measurements of protein levels and chromatin accessibility profiles, and mitochondrial DNA-based clonal tracing.
