evidence: The use of paired-end libraries with a fragment size shorter than twice the read length provides an opportunity
  to generate much longer reads by overlapping and merging read pairs before assembling a genome.ResultsWe present FLASH,
  a fast computational tool to extend the length of short reads by overlapping paired-end reads from fragment libraries that
  are sufficiently short.
