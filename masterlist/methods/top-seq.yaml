evidence: Here, we describe an alternative epigenome profiling approach, named TOP-seq, which is based on covalent tagging
  of individual unmodified CG sites followed by non-homologous priming of the DNA polymerase action at these sites to directly
  produce adjoining regions for their sequencing and precise genomic mapping.
