evidence: Here we introduce CODIAC (Cell Organization and Disturbance-mapping using Image-Activated Cell-profiling), which
  couples image-enabled cell sorting (ICS) with improved Cas12a-assisted endogenous PCR tagging and machine-learning-guided
  gating to profile pools of fluorescently tagged proteins.
