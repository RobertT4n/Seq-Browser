evidence: Our framework includes a phylogenetic hidden Markov model, called epiPhyloHMM, for identifying the locations of
  multiply aligned CREs, and a combined phylogenetic and generalized linear model, called phyloGLM, for accounting for the
  influence of a rich set of genomic features in describing their evolutionary dynamics.
