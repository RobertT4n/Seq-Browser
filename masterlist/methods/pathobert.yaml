evidence: Here, we present PathoBERT, a hybrid deep learning framework that integrates a LoRA adapted DNABERT encoder with
  convolutional feature extraction, a modified Convolutional Block Attention Module (MCBAM), and Multiscale Convolutional
  Attention (MSCA) for bacterial pathogenicity prediction.
