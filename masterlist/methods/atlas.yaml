evidence: Here we introduce atlas-scale transcriptome localization using aggregate signatures (ATLAS), a scalable tissue mapping
  method that learns transcriptional signatures from single-cell RNA sequencing data, encodes them in situ with tens of thousands
  of oligonucleotide probes and decodes them to infer cell types and imputed transcriptomes.
