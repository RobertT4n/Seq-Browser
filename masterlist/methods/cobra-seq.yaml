name: COBRA-seq
full_name: Combined Bisulfite Restriction Analysis sequencing
category: wet
summary: Reduced-representation methylome profiling that digests bisulfite-converted DNA with a restriction enzyme (e.g. TaqI)
  and sequences the fragments, with PCR or linear amplification.
