evidence: Presently, there is a lack of scalable software able to perform key tasks on pangenomes, such as quantifying universally
  shared sequence across genomes (the core genome) and measuring the extent of genomic variability as a function of sample
  size (pangenome growth).ResultsWe introduce Panacus (pangenome-abacus), a tool designed to rapidly perform these tasks and
  visualize the results in interactive plots.
