evidence: Here we introduce our tool PeakATail, which calls polyadenylation sites from reads still carrying a piece of the
  tail, ranks them by how many distinct molecules carry that evidence, discards sites where adenosine-rich genomic sequence
  mimics a tail, and pairs them with a differential test whose error rate is measured, not assumed.
