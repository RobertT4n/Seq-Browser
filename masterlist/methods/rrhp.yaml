evidence: We present an approach called Reduced Representation 5-Hydroxymethylcytosine Profiling (RRHP) to map 5hmC sites
  at single-base resolution by exploiting the use of beta-glucosyltransferase to inhibit enzymatic digestion at the junction
  where adapters are ligated to a genomic library.
