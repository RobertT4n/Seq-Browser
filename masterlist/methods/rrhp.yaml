name: RRHP
full_name: Reduced Representation 5-Hydroxymethylcytosine Profiling
category: wet
summary: Beta-glucosyltransferase blocks restriction digestion at the adapter-ligation junction so only fragments with glucosylated
  5hmC at the junction are sequenced, mapping 5hmC at single-site resolution.
