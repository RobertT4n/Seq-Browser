evidence: Next, we developed “reference-assisted 3D genome assembly,” which begins with a reference genome assembly from a
  related species, and uses Hi-C and DNA-Seq data from a target species to split, order, orient, and correct sequences on
  the basis of their 3D proximity, yielding accurate chromosome-length scaffolds for the target species.
shared_doi: "paper introduces both the PaleoHi-C protocol and the reference-assisted 3D assembly method"
