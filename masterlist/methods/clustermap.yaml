evidence: Here, we introduce an unsupervised and annotation-free framework, termed ClusterMap, which incorporates the physical
  location and gene identity of RNAs, formulates the task as a point pattern analysis problem, and identifies biologically
  meaningful structures by density peak clustering (DPC).
