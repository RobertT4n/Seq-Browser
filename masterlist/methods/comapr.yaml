evidence: Here, we introduce efficient software tools for the essential tasks of generating personalised haplotypes and calling
  crossovers in gametes from single-gamete DNA sequencing data (sgcocaller), and constructing, visualising, and comparing
  individualised crossover landscapes from single gametes (comapr).
